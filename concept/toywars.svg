<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial Rounded MT Bold, Arial, sans-serif">
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3ff"/><stop offset="1" stop-color="#ffe9c4"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c98f55"/><stop offset="1" stop-color="#8a5a2e"/></linearGradient>
<linearGradient id="light" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6c8" stop-opacity=".75"/><stop offset="1" stop-color="#fff6c8" stop-opacity="0"/></linearGradient>
<linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd23f"/><stop offset="1" stop-color="#f0a800"/></linearGradient>
<linearGradient id="gunA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#e0560f"/></linearGradient>
<linearGradient id="gunB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fd6c8"/><stop offset="1" stop-color="#14998d"/></linearGradient>
<linearGradient id="sleeve" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e84a4a"/><stop offset="1" stop-color="#b02a2a"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".35"/></filter>
</defs>
<!-- room -->
<rect width="1280" height="720" fill="url(#wall)"/>
<rect x="0" y="0" width="1280" height="330" fill="#f4d9a8" opacity=".35"/>
<!-- window -->
<g filter="url(#blur2)"><rect x="150" y="40" width="260" height="200" rx="10" fill="#aee0ff"/><rect x="278" y="40" width="4" height="200" fill="#fff"/><rect x="150" y="138" width="260" height="4" fill="#fff"/></g>
<!-- shelf with toys -->
<g filter="url(#blur2)"><rect x="760" y="120" width="420" height="16" fill="#a8723c"/>
<rect x="790" y="62" width="58" height="58" rx="8" fill="#4aa3ff"/><rect x="860" y="80" width="40" height="40" rx="8" fill="#ffd23f"/><circle cx="960" cy="94" r="26" fill="#e84a4a"/><rect x="1010" y="70" width="70" height="50" rx="10" fill="#6cd66c"/></g>
<!-- floor -->
<polygon points="0,330 1280,330 1280,720 0,720" fill="url(#floor)"/>
<g stroke="#6f4623" stroke-width="2" opacity=".5">
<line x1="640" y1="330" x2="-400" y2="720"/><line x1="640" y1="330" x2="-120" y2="720"/><line x1="640" y1="330" x2="200" y2="720"/><line x1="640" y1="330" x2="520" y2="720"/><line x1="640" y1="330" x2="760" y2="720"/><line x1="640" y1="330" x2="1080" y2="720"/><line x1="640" y1="330" x2="1400" y2="720"/><line x1="640" y1="330" x2="1680" y2="720"/>
<line x1="0" y1="360" x2="1280" y2="360"/><line x1="0" y1="410" x2="1280" y2="410"/><line x1="0" y1="480" x2="1280" y2="480"/><line x1="0" y1="580" x2="1280" y2="580"/></g>
<!-- play mat road -->
<polygon points="520,330 760,330 1000,720 280,720" fill="#4b5563" opacity=".92"/>
<g stroke="#ffe27a" stroke-width="6" stroke-dasharray="26 22" opacity=".9"><line x1="640" y1="335" x2="640" y2="720"/></g>
<rect x="0" y="330" width="1280" height="6" fill="#00000022"/>
<!-- light shaft -->
<polygon points="150,240 410,240 900,720 300,720" fill="url(#light)"/>
<!-- far toy blocks -->
<g filter="url(#sh)">
<rect x="880" y="262" width="96" height="96" rx="12" fill="#ffd23f"/><text x="928" y="330" font-size="64" text-anchor="middle" fill="#b07c00">A</text>
<rect x="330" y="290" width="70" height="70" rx="10" fill="#4aa3ff"/><text x="365" y="340" font-size="46" text-anchor="middle" fill="#1d5fa8">B</text>
<rect x="1010" y="330" width="130" height="130" rx="14" fill="#e84a4a"/><text x="1075" y="428" font-size="88" text-anchor="middle" fill="#9c2323">C</text>
</g>
<!-- enemy toy robot (blue team) -->
<g transform="translate(610,262)" filter="url(#sh)">
<ellipse cx="30" cy="104" rx="30" ry="6" fill="#00000040"/>
<rect x="6" y="40" width="48" height="50" rx="8" fill="#4aa3ff"/><rect x="14" y="48" width="32" height="14" rx="4" fill="#bfe3ff"/>
<rect x="12" y="6" width="36" height="32" rx="8" fill="#6bb8ff"/><circle cx="23" cy="22" r="4.5" fill="#fff"/><circle cx="37" cy="22" r="4.5" fill="#fff"/><circle cx="23" cy="22" r="2" fill="#222"/><circle cx="37" cy="22" r="2" fill="#222"/>
<rect x="28" y="-8" width="4" height="14" fill="#888"/><circle cx="30" cy="-10" r="4" fill="#ff4d4d"/>
<rect x="-6" y="44" width="12" height="34" rx="6" fill="#2e86e0"/><rect x="54" y="44" width="12" height="34" rx="6" fill="#2e86e0"/>
<rect x="12" y="90" width="14" height="14" rx="4" fill="#2e86e0"/><rect x="34" y="90" width="14" height="14" rx="4" fill="#2e86e0"/>
</g>
<!-- enemy tag -->
<g transform="translate(640,240)"><rect x="-52" y="-34" width="104" height="30" rx="15" fill="#1d5fa8" stroke="#fff" stroke-width="3"/><text x="0" y="-13" font-size="15" fill="#fff" text-anchor="middle">RoboBleu</text>
<rect x="-40" y="-2" width="80" height="8" rx="4" fill="#00000066"/><rect x="-40" y="-2" width="54" height="8" rx="4" fill="#5be36b"/></g>
<!-- dart in flight + hit sparks -->
<g><ellipse cx="560" cy="396" rx="14" ry="6" fill="#e0560f" transform="rotate(-25 560 396)"/><circle cx="572" cy="391" r="7" fill="#ff8a3d"/>
<path d="M530 410 L500 422" stroke="#fff" stroke-width="3" opacity=".6"/></g>
<g fill="#ffd23f"><circle cx="560" cy="330" r="5"/><circle cx="575" cy="312" r="4"/><circle cx="548" cy="312" r="3"/></g>
<!-- crosshair -->
<g stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"><circle cx="640" cy="360" r="14" opacity=".9"/><line x1="640" y1="338" x2="640" y2="328"/><line x1="640" y1="382" x2="640" y2="392"/><line x1="618" y1="360" x2="608" y2="360"/><line x1="662" y1="360" x2="672" y2="360"/></g>
<g stroke="#ff4d4d" stroke-width="3" stroke-linecap="round"><line x1="680" y1="345" x2="690" y2="335"/><line x1="680" y1="375" x2="690" y2="385"/><line x1="600" y1="345" x2="590" y2="335"/><line x1="600" y1="375" x2="590" y2="385"/></g>

<!-- VIEWMODEL: left arm holding yo-yo -->
<g filter="url(#sh)">
<path d="M-40 720 L40 560 Q110 500 190 540 L230 720 Z" fill="url(#sleeve)"/>
<rect x="20" y="520" width="170" height="60" rx="28" fill="url(#skin)" transform="rotate(-12 100 550)"/>
<g transform="translate(190,470)"><circle r="62" fill="#e84a4a"/><circle r="62" fill="none" stroke="#fff" stroke-width="6" opacity=".6"/><circle r="22" fill="#fff"/><circle r="10" fill="#b02a2a"/><path d="M-62 0 A62 62 0 0 1 0 -62" stroke="#ffffff" stroke-width="8" fill="none" opacity=".5"/></g>
<path d="M190 408 Q260 300 330 262" stroke="#fff" stroke-width="3" fill="none" opacity=".8"/>
<rect x="150" y="500" width="70" height="40" rx="18" fill="url(#skin)"/>
</g>
<!-- VIEWMODEL: right arm + dart blaster -->
<g filter="url(#sh)">
<path d="M1000 720 L1060 540 Q1160 470 1330 520 L1330 720 Z" fill="url(#sleeve)"/>
<!-- blaster body -->
<g transform="rotate(9 840 520)">
<rect x="560" y="440" width="470" height="92" rx="40" fill="url(#gunA)"/>
<rect x="560" y="440" width="470" height="26" rx="13" fill="#fff" opacity=".28"/>
<rect x="470" y="462" width="150" height="48" rx="22" fill="url(#gunB)"/>
<ellipse cx="478" cy="486" rx="14" ry="24" fill="#0e6e65"/>
<circle cx="478" cy="486" r="11" fill="#ff4d4d"/>
<rect x="690" y="410" width="190" height="42" rx="18" fill="url(#gunB)"/>
<rect x="705" y="418" width="160" height="10" rx="5" fill="#fff" opacity=".4"/>
<rect x="900" y="510" width="90" height="70" rx="20" fill="#d94f0e"/>
<rect x="760" y="500" width="120" height="54" rx="14" fill="#14998d"/>
<g fill="#fff" opacity=".85"><rect x="780" y="512" width="12" height="30" rx="4"/><rect x="800" y="512" width="12" height="30" rx="4"/><rect x="820" y="512" width="12" height="30" rx="4"/></g>
<rect x="990" y="458" width="40" height="56" rx="14" fill="#ffd23f"/>
</g>
<!-- hand -->
<g transform="rotate(9 840 520)"><rect x="880" y="505" width="130" height="86" rx="38" fill="url(#skin)"/>
<rect x="896" y="498" width="100" height="26" rx="13" fill="#ffe27a"/>
<rect x="906" y="548" width="26" height="46" rx="12" fill="#f0a800"/><rect x="936" y="548" width="26" height="50" rx="12" fill="#f0a800"/><rect x="966" y="548" width="26" height="46" rx="12" fill="#f0a800"/>
<rect x="840" y="470" width="62" height="34" rx="16" fill="url(#skin)"/></g>
</g>
<!-- muzzle pop -->
<g transform="translate(462,418)" opacity=".95"><circle r="16" fill="#fff3a8"/><circle r="8" fill="#fff"/><path d="M0 -30 L6 -10 L26 -16 L10 -2 L28 12 L6 8 L2 30 L-4 10 L-24 16 L-10 0 L-26 -14 L-6 -10Z" fill="#ffd23f" opacity=".8"/></g>

<!-- HUD -->
<g>
<rect x="30" y="30" width="270" height="60" rx="30" fill="#00000066" stroke="#fff" stroke-width="3"/>
<circle cx="64" cy="60" r="20" fill="#e84a4a"/><text x="64" y="68" font-size="22" fill="#fff" text-anchor="middle">12</text>
<text x="165" y="68" font-size="22" fill="#fff" text-anchor="middle">ROUGE</text>
<rect x="490" y="24" width="300" height="52" rx="26" fill="#00000066" stroke="#fff" stroke-width="3"/>
<text x="640" y="59" font-size="26" fill="#fff" text-anchor="middle">12  •  3:24  •  9</text>
<rect x="980" y="30" width="270" height="60" rx="30" fill="#00000066" stroke="#fff" stroke-width="3"/>
<text x="1115" y="68" font-size="22" fill="#fff" text-anchor="middle">BLEU</text><circle cx="1216" cy="60" r="20" fill="#4aa3ff"/><text x="1216" y="68" font-size="22" fill="#fff" text-anchor="middle">9</text>
<!-- kill feed -->
<g font-size="15" fill="#fff"><rect x="1000" y="110" width="250" height="30" rx="15" fill="#00000066"/><text x="1125" y="131" text-anchor="middle">Toi  ➜  Poupée42</text>
<rect x="1000" y="146" width="250" height="30" rx="15" fill="#00000066"/><text x="1125" y="167" text-anchor="middle">Ourson  ➜  RoboBleu</text></g>
<!-- health -->
<rect x="30" y="636" width="320" height="52" rx="26" fill="#00000066" stroke="#fff" stroke-width="3"/>
<rect x="42" y="648" width="296" height="28" rx="14" fill="#00000055"/><rect x="42" y="648" width="214" height="28" rx="14" fill="#5be36b"/>
<text x="190" y="670" font-size="18" fill="#fff" text-anchor="middle">♥ 72</text>
<!-- ammo -->
<rect x="940" y="620" width="310" height="68" rx="34" fill="#00000066" stroke="#fff" stroke-width="3"/>
<text x="1060" y="668" font-size="38" fill="#fff" text-anchor="middle">8 <tspan font-size="22" fill="#cfd8e3">/ 24</tspan></text>
<text x="1190" y="662" font-size="16" fill="#ffd23f" text-anchor="middle">FLÉCHETTES</text>
<g transform="translate(965,654)" fill="#ff8a3d"><rect x="0" y="-12" width="10" height="24" rx="4"/><rect x="14" y="-12" width="10" height="24" rx="4"/><rect x="28" y="-12" width="10" height="24" rx="4" opacity=".4"/></g>
</g>
</svg>
